<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0B0D"/>
      <stop offset="55%" stop-color="#121418"/>
      <stop offset="100%" stop-color="#17191E"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B1D22"/>
      <stop offset="45%" stop-color="#131519"/>
      <stop offset="100%" stop-color="#0A0B0D"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E4222F" stop-opacity=".85"/>
      <stop offset="45%" stop-color="#C62855" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#C62855" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6E4A" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#FF6E4A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E4222F" stop-opacity=".34"/>
      <stop offset="70%" stop-color="#C62855" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#C62855" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF3B45" stop-opacity=".05"/>
      <stop offset="35%" stop-color="#FF3B45" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#8E1220" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="mirror" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#2A2E36" stop-opacity=".9"/>
      <stop offset="50%" stop-color="#1A1D23" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#0F1115" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="reflFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="72%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".72"/>
    </radialGradient>
    <filter id="blurLg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="blurMd" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blurSm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="softRefl" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="floorClip"><rect x="0" y="700" width="1920" height="380"/></clipPath>
  </defs>

  <!-- 벽 / 바닥 -->
  <rect width="1920" height="1080" fill="url(#wall)"/>
  <rect x="0" y="700" width="1920" height="380" fill="url(#floor)"/>
  <rect x="0" y="697" width="1920" height="3" fill="#2A2E36" opacity=".5"/>

  <!-- 바닥 원근 라인 -->
  <g stroke="#3A3F49" stroke-width="1.4" opacity=".16">
    <path d="M280 1080 L820 700"/><path d="M700 1080 L900 700"/>
    <path d="M1220 1080 L1020 700"/><path d="M1640 1080 L1100 700"/>
    <path d="M0 900 H1920" stroke-width="1"/><path d="M0 790 H1920" stroke-width="1"/>
  </g>

  <!-- 천장 붉은 라인 조명 -->
  <g>
    <rect x="360" y="86" width="1200" height="7" rx="3.5" fill="#FF3B45" opacity=".9"/>
    <rect x="360" y="86" width="1200" height="7" rx="3.5" fill="#FF3B45" filter="url(#blurMd)" opacity=".8"/>
    <rect x="620" y="150" width="680" height="5" rx="2.5" fill="#FF6E4A" opacity=".55" filter="url(#blurSm)"/>
  </g>

  <!-- 뒷벽 수직 라이트 스트립 -->
  <g>
    <rect x="248" y="168" width="9" height="470" fill="url(#strip)"/>
    <rect x="248" y="168" width="9" height="470" fill="#FF3B45" opacity=".55" filter="url(#blurMd)"/>
    <rect x="1664" y="168" width="9" height="470" fill="url(#strip)"/>
    <rect x="1664" y="168" width="9" height="470" fill="#FF3B45" opacity=".55" filter="url(#blurMd)"/>
    <rect x="946" y="212" width="6" height="400" fill="url(#strip)" opacity=".7"/>
    <rect x="946" y="212" width="6" height="400" fill="#FF3B45" opacity=".35" filter="url(#blurMd)"/>
  </g>

  <!-- 볼류메트릭 광선 -->
  <g opacity=".85">
    <path d="M300 92 L120 700 L470 700 Z" fill="url(#beam)" filter="url(#blurMd)"/>
    <path d="M960 92 L790 700 L1130 700 Z" fill="url(#beam)" opacity=".8" filter="url(#blurMd)"/>
    <path d="M1620 92 L1450 700 L1800 700 Z" fill="url(#beam)" filter="url(#blurMd)"/>
  </g>

  <!-- 넓은 붉은 글로우 -->
  <ellipse cx="300" cy="620" rx="480" ry="380" fill="url(#glowRed)" filter="url(#blurLg)" opacity=".75"/>
  <ellipse cx="1660" cy="660" rx="430" ry="340" fill="url(#glowRed)" filter="url(#blurLg)" opacity=".6"/>
  <ellipse cx="980" cy="740" rx="560" ry="220" fill="url(#glowWarm)" filter="url(#blurLg)" opacity=".45"/>

  <!-- 우측 거울 패널 -->
  <g>
    <rect x="1418" y="252" width="196" height="446" rx="6" fill="url(#mirror)"/>
    <rect x="1418" y="252" width="196" height="446" rx="6" fill="none" stroke="#3D434E" stroke-width="2" opacity=".55"/>
    <path d="M1418 560 L1614 320 L1614 400 L1418 640 Z" fill="#FF3B45" opacity=".1"/>
    <rect x="1198" y="286" width="180" height="412" rx="6" fill="url(#mirror)" opacity=".8"/>
    <rect x="1198" y="286" width="180" height="412" rx="6" fill="none" stroke="#3D434E" stroke-width="2" opacity=".4"/>
  </g>

  <!-- ===== 기구 실루엣 ===== -->
  <g fill="#050608">

    <!-- 좌측 스쿼트 랙 -->
    <g>
      <rect x="152" y="248" width="26" height="452" rx="4"/>
      <rect x="392" y="248" width="26" height="452" rx="4"/>
      <rect x="152" y="248" width="266" height="20" rx="5"/>
      <rect x="140" y="686" width="292" height="16" rx="5"/>
      <rect x="152" y="396" width="266" height="11" rx="4" opacity=".9"/>
      <!-- 바벨 + 원판 -->
      <rect x="118" y="352" width="334" height="12" rx="6"/>
      <rect x="140" y="318" width="22" height="80" rx="6"/>
      <rect x="166" y="330" width="16" height="56" rx="5"/>
      <rect x="408" y="318" width="22" height="80" rx="6"/>
      <rect x="388" y="330" width="16" height="56" rx="5"/>
      <!-- 랙 포스트 하이라이트 -->
      <rect x="150" y="248" width="4" height="452" fill="#FF3B45" opacity=".28"/>
      <rect x="416" y="248" width="4" height="452" fill="#FF3B45" opacity=".2"/>
    </g>

    <!-- 중앙 벤치 -->
    <g>
      <rect x="646" y="596" width="212" height="20" rx="9"/>
      <rect x="672" y="616" width="18" height="86" rx="5"/>
      <rect x="816" y="616" width="18" height="86" rx="5"/>
      <rect x="654" y="694" width="58" height="12" rx="5"/>
      <rect x="796" y="694" width="58" height="12" rx="5"/>
      <rect x="646" y="594" width="212" height="5" rx="2.5" fill="#FF3B45" opacity=".3"/>
    </g>

    <!-- 케이블 머신 -->
    <g>
      <rect x="1018" y="286" width="24" height="414" rx="4"/>
      <rect x="1128" y="286" width="24" height="414" rx="4"/>
      <rect x="1018" y="286" width="134" height="18" rx="5"/>
      <rect x="1030" y="470" width="110" height="230" rx="6" opacity=".95"/>
      <g fill="#12141A">
        <rect x="1042" y="486" width="86" height="12" rx="3"/>
        <rect x="1042" y="506" width="86" height="12" rx="3"/>
        <rect x="1042" y="526" width="86" height="12" rx="3"/>
        <rect x="1042" y="546" width="86" height="12" rx="3"/>
        <rect x="1042" y="566" width="86" height="12" rx="3"/>
      </g>
      <path d="M1030 304 L1030 452" stroke="#050608" stroke-width="4" fill="none"/>
      <rect x="1006" y="440" width="48" height="10" rx="5"/>
      <rect x="1016" y="286" width="4" height="414" fill="#FF3B45" opacity=".22"/>
    </g>

    <!-- 우측 덤벨 랙 -->
    <g>
      <path d="M1666 700 L1690 556 L1898 556 L1898 700 Z"/>
      <rect x="1672" y="608" width="230" height="14" rx="5"/>
      <rect x="1682" y="548" width="216" height="14" rx="5"/>
      <g>
        <rect x="1700" y="512" width="16" height="40" rx="5"/><rect x="1716" y="524" width="38" height="16" rx="6"/><rect x="1754" y="512" width="16" height="40" rx="5"/>
        <rect x="1790" y="512" width="16" height="40" rx="5"/><rect x="1806" y="524" width="38" height="16" rx="6"/><rect x="1844" y="512" width="16" height="40" rx="5"/>
        <rect x="1696" y="572" width="16" height="40" rx="5"/><rect x="1712" y="584" width="38" height="16" rx="6"/><rect x="1750" y="572" width="16" height="40" rx="5"/>
        <rect x="1788" y="572" width="16" height="40" rx="5"/><rect x="1804" y="584" width="38" height="16" rx="6"/><rect x="1842" y="572" width="16" height="40" rx="5"/>
      </g>
      <rect x="1682" y="546" width="216" height="4" rx="2" fill="#FF3B45" opacity=".3"/>
    </g>

    <!-- 원판 스탠드 -->
    <g>
      <rect x="530" y="512" width="14" height="188" rx="5"/>
      <rect x="500" y="688" width="74" height="14" rx="5"/>
      <circle cx="537" cy="556" r="44"/><circle cx="537" cy="556" r="14" fill="#12141A"/>
      <circle cx="537" cy="632" r="36"/><circle cx="537" cy="632" r="12" fill="#12141A"/>
    </g>

  </g>

  <!-- 바닥 반사 -->
  <g clip-path="url(#floorClip)" opacity=".3">
    <g transform="translate(0,1400) scale(1,-1)" filter="url(#softRefl)" fill="#050608">
      <rect x="152" y="248" width="26" height="452" rx="4"/>
      <rect x="392" y="248" width="26" height="452" rx="4"/>
      <rect x="1018" y="286" width="24" height="414" rx="4"/>
      <rect x="1128" y="286" width="24" height="414" rx="4"/>
      <path d="M1666 700 L1690 556 L1898 556 L1898 700 Z"/>
      <rect x="646" y="596" width="212" height="20" rx="9"/>
    </g>
    <rect x="0" y="700" width="1920" height="380" fill="url(#reflFade)"/>
  </g>

  <!-- 바닥 붉은 반사광 -->
  <ellipse cx="300" cy="760" rx="300" ry="48" fill="#E4222F" opacity=".22" filter="url(#blurLg)"/>
  <ellipse cx="1660" cy="790" rx="270" ry="44" fill="#C62855" opacity=".2" filter="url(#blurLg)"/>
  <ellipse cx="960" cy="820" rx="360" ry="40" fill="#FF6E4A" opacity=".12" filter="url(#blurLg)"/>

  <!-- 비네트 -->
  <rect width="1920" height="1080" fill="url(#vig)"/>
</svg>
